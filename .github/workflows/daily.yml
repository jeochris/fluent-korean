name: 오늘의 한국어

on:
  schedule:
    # 매일 09:17 KST (= 00:17 UTC). GitHub Actions cron 은 UTC 기준이다.
    # 정각(0분)은 전 세계에서 몰리는 시간이라 크게 밀리거나 아예 건너뛴다.
    # 실제로 "0 0 * * *" 로 두었더니 첫 스케줄이 한 시간 넘게 오지 않았다.
    - cron: "17 0 * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python bot.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
