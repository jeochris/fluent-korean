name: 오늘의 한국어

on:
  schedule:
    # 평일(월~금) 아침 10시쯤 KST 에 오도록 맞춘 값. GitHub Actions cron 은 UTC 기준이다.
    #
    # 예약 시각 그대로 도는 게 아니다. 2026-09-08 ~ 09-21 두 주 동안 "15 1 * * *"(10:15 KST)로
    # 두었더니 매일 14:45 ~ 15:18 KST 에 도착했다. 거의 정확히 4시간 40분씩 밀린다.
    # 그래서 예약을 5시간 앞당겨 05:15 KST(= 20:15 UTC 전날) 로 두었다. 실제 도착은 10시 전후.
    #
    # 요일: UTC 기준 일~목 20:15 = KST 기준 월~금 05:15. 그래서 "0-4" 다.
    # 정각(0분)은 전 세계에서 몰리는 시간이라 크게 밀리거나 아예 건너뛴다.
    # 실제로 "0 0 * * *" 로 두었더니 첫 스케줄이 한 시간 넘게 오지 않았다.
    - cron: "15 20 * * 0-4"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python bot.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
